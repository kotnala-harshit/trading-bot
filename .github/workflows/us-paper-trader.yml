name: US paper trader

on:
  schedule:
    # Covers 09:30–16:00 New York through both daylight-saving offsets.
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 13-21 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: Run outside US hours for a paper test
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: portfolio-paper-traders
  cancel-in-progress: false

jobs:
  paper-trade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - run: python -m qts.us_automation ${{ inputs.force && '--force' || '' }}
      - name: Save US paper state and dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A runtime docs
          git diff --cached --quiet || git commit -m "Update US paper portfolio"
          git pull --rebase origin main
          git push origin HEAD:main
