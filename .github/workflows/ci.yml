name: CI
on:
  push:
    paths-ignore:
      - "runtime/**"
      - "docs/**"
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix: {python-version: ["3.11", "3.12", "3.13"]}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python-version }}"}
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest -q
      - run: python -m compileall -q src app.py
      - run: python -m qts.runtime --once --config configs/production-paper.yaml
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with: {context: ., push: false, tags: quant-trading-workbench:ci}
