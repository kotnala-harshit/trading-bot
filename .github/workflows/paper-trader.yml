name: NSE paper trader

on:
  schedule:
    # Off-peak minutes reduce GitHub scheduler delays and dropped jobs.
    - cron: "52 3 * * 1-5"
    - cron: "7,22,37,52 4-9 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: Run even when NSE is closed (paper test only)
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: nse-paper-trader
  cancel-in-progress: true

jobs:
  paper-trade:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Run paper strategy
        run: python -m qts.automation ${{ inputs.force && '--force' || '' }}
      - name: Save paper state and dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A runtime docs
          git diff --cached --quiet || git commit -m "Update paper portfolio"
          git push origin HEAD:main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
