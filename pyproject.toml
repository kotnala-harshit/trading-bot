[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-trading-workbench"
version = "5.0.0"
description = "Safety-first MES research, validation, and IBKR readiness workbench"
requires-python = ">=3.11"
dependencies = ["pandas>=2.1", "numpy>=1.26", "PyYAML>=6.0", "streamlit>=1.38", "plotly>=5.24"]

[project.optional-dependencies]
ibkr = ["ib-insync>=0.9.86"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
qts = "qts.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

